<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChatGPT 管理员登录</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="/assets/favicon.svg?v=1.3.9">
    <link rel="stylesheet" href="/assets/styles.css?v=1.3.8">
  </head>
  <body class="login-page">
    <main class="login-card">
      <h1>服务器浏览器登录</h1>
      <p>输入管理员访问码后打开服务器 Chrome。Google 登录被限制时，请使用 /admin/signin 手动登录入口。</p>
      <form action="/auth/admin" method="post" autocomplete="off">
        <label for="code">管理员访问码</label>
        <input id="code" name="code" type="password" required autofocus autocomplete="current-password">
        <button type="submit">打开管理员页面</button>
      </form>
      <p id="login-error" class="login-error" hidden>管理员访问码不正确，请重试。</p>
    </main>
    <script src="/assets/login.js?v=1.3.8" defer></script>
  </body>
</html>
