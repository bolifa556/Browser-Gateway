<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <title>ChatGPT</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="/assets/favicon.svg?v=1.3.9">
    <link rel="stylesheet" href="/assets/styles.css?v=1.4.1">
  </head>
  <body class="remote-page">
    <main id="stage" aria-label="ChatGPT remote browser">
      <canvas id="screen" tabindex="0"></canvas>
      <textarea id="ime" aria-label="Keyboard input" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      <input id="file-picker" type="file" hidden>
      <div id="connection" class="connection">正在连接服务器浏览器…</div>
      <div id="notice" class="notice" hidden></div>
    </main>
    <script src="/assets/app.js?v=1.4.4" type="module"></script>
  </body>
</html>
