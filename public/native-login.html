<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ChatGPT 管理员手动登录</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="/assets/favicon.svg?v=1.3.9">
    <link rel="stylesheet" href="/assets/styles.css?v=1.4.1">
  </head>
  <body class="remote-page" data-mode="native-login">
    <div id="manual-controls"><span id="login-status">独占手动登录：成员页面会暂时停用</span><button id="finish-login" hidden>登录完成，恢复成员页面</button></div>
    <main id="stage" aria-label="服务器 Chrome 手动登录">
      <canvas id="screen" tabindex="0"></canvas>
      <textarea id="ime" aria-label="Keyboard input" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      <input id="file-picker" type="file" hidden>
      <div id="connection" class="connection"><section class="login-card">
        <h1>用服务器上的 Chrome 手动登录</h1>
        <p>使用原来的账号数据和代理，只传画面和人工键鼠，不使用网页控制接口。开始后，成员页暂时停用；完成后会自动重连。</p>
        <p>此模式显示 Chrome 地址栏，请确认登录网站是 accounts.google.com 或 auth.openai.com。请勿访问不可信网站。本站 HTTP 未加密，输入密码建议使用同端口 HTTPS 并核对自签名证书。</p>
        <button id="start-login">开始手动登录</button><p id="start-error" class="login-error" hidden></p>
      </section></div>
      <div id="notice" class="notice" hidden></div>
    </main>
    <script src="/assets/native-login.js?v=1.4.3" type="module"></script>
  </body>
</html>
